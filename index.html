.attack==='aggressive'?'Modo agresivo':'Modo inteligente','attack')+'</div><p class="hint">Hasta la quincena que sigue a la próxima. Se apartan hoy todas las obligaciones conocidas dentro de estas fechas, sin contar nóminas pendientes.</p><dl class="breakdown"><div><dt>Pagos del horizonte</dt><dd>'+money(p.obligations)+'</dd></div><div><dt>De ellos, vencidos o para hoy</dt><dd>'+money(p.immediate)+'</dd></div><div><dt>Esenciales · '+(state.settings.essentialKind==='daily'?p.span+' días':'sobre restante')+'</dt><dd>'+money(p.essential)+'</dd></div><div><dt>Colchón de seguridad</dt><dd>'+money(p.cushion)+'</dd></div><div><dt>'+(p.noDebt?'Aportación propuesta a meta':'Extra propuesto · '+(state.settings.attack==='aggressive'?'agresivo':'inteligente'))+'</dt><dd>'+money(p.extra)+'</dd></div><div><dt>Total apartado / propuesto</dt><dd>'+money(p.totalReserve)+'</dd></div></dl><p class="hint">Apartar es planear; el saldo cambia cuando registras un movimiento. El pago extra no incluye anticipar MSI sin autorización del banco.</p></section></div><div style="height:16px"></div>'+issueView(p)+(p.deficit?notice('Faltante conocido: '+money(p.deficit)+'. Tus cifras actuales no cubren pagos, esenciales y colchón. Revisa gastos o ingresos antes de comprar.',true):'')+bankShortage(p)+'<div class="grid"><section class="panel"><div class="row wrap"><h2>Lo que sigue</h2>'+btn('Ver todos','nav','payments')+'</div>'+p.inside.slice(0,5).map(x=>paymentItem(x,p)).join('')+(p.inside.length?'':empty('No hay pagos pendientes capturados dentro del horizonte.'))+'</section><section class="panel"><div class="row wrap"><h2>Próximas nóminas</h2>'+btn('Agregar','income')+'</div>'+state.incomes.filter(i=>i.status==='expected').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(incomeItem).join('')+'<p class="hint">Si el depósito ya está en un saldo que acabas de actualizar, confírmalo sin sumarlo otra vez.</p>'+btn('Proyección por fecha','timeline')+'</section><section class="panel wide"><h2>Fuera del horizonte · sin cubrir</h2><p class="warn">Estos pagos NO se contemplan en tu gasto diario libre.</p>'+p.outside.slice(0,5).map(x=>paymentItem(x,p,true)).join('')+(p.outside.length?'':empty('No hay otros pagos conocidos en los próximos 100 días.'))+'<p class="hint">Los periodos nuevos dejan su importe vacío hasta que lo captures. Un importe vacío nunca significa 0.</p></section></div>'+(p.noDebt?goalView(): '');}
function bankShortage(p){let need=p.inside.filter(x=>(state.templates.find(t=>t.id===x.templateId)?.account??'bank')==='bank').reduce((a,x)=>a+Math.max(0,required(state,x)-paid(state,x)),0);return need>(p.bank??0)&&p.cash>0?notice('Hay efectivo, pero nómina no alcanza para los pagos asignados a esa cuenta. Deposita o transfiere entre tus saldos y registra el movimiento.',true):''}
function paymentItem(x,p,outside=false){
 const t=state.templates.find(t=>t.id===x.templateId),c=state.cards.find(c=>c.id===t.cardId),done=mPaid(state,x),gaps=missingPeriod(state,x),need=Math.max(0,required(state,x)-paid(state,x)),entered=t.type==='card'?x.pgni:x.amount;
 const status=done?'Pagado':outside?'Sin contemplar':gaps.length||p.issues.length?'Faltan datos':p.traffic[x.id]==='red'?'No alcanza':p.traffic[x.id]==='yellow'?'Justo':'Cubierto con saldo actual';
 const color=done?'good':outside||gaps.length||p.issues.length?'warn':p.traffic[x.id]==='red'?'bad':p.traffic[x.id]==='yellow'?'warn':'good';
 return '<article class="item"><div class="row wrap"><div><div class="hint">Descripción</div><h3>'+esc(label(state,x))+'</h3></div>'+pill(status,color)+'</div><dl class="breakdown"><div><dt>Importe'+(c?' · pago para no generar intereses':'')+'</dt><dd>'+money(entered)+'</dd></div><div><dt>Periodo</dt><dd>'+fmt(x.start)+'<br>'+fmt(x.end)+'</dd></div><div><dt>Fecha de corte</dt><dd>'+(x.cut?fmt(x.cut):'No aplica')+'</dd></div><div><dt>Fecha de pago</dt><dd>'+fmt(x.due)+(x.due<today()&&!done?' · Vencido':'')+'</dd></div><div><dt>Pagado</dt><dd>'+pill(done?'Sí':'No',done?'good':'warn')+'</dd></div><div><dt>Observaciones</dt><dd style="white-space:pre-wrap;overflow-wrap:anywhere;max-width:65%">'+esc(x.notes||'—')+'</dd></div>'+(c?'<div><dt>Deuda total de esta tarjeta</dt><dd>'+money(cardBalance(state,c))+'</dd></div>':'')+'<div><dt>Pendiente de este periodo</dt><dd>'+money(need)+'</dd></div></dl>'+(gaps.length?'<p class="warn">Falta: '+esc(gaps.join(', '))+'</p>':'')+(c&&required(state,x)!==entered?'<p class="hint">Apartado calculado: '+money(required(state,x))+'. Incluye MSI adicionales o compras todavía no integradas en el estado de cuenta.</p>':'')+'<div class="actions">'+btn('Editar captura','period',x.id)+btn(done?'Marcar pendiente':'Marcar pagado',done?'markPending':'markPaid',x.id)+(done?'':btn('Abono parcial','pay',x.id))+'</div></article>';
}

function incomeItem(i){return '<div class="item"><div class="row"><div><strong>'+fmt(i.date)+'</strong><p>'+pill(i.date<today()?'Retrasada · sin confirmar':'Prevista',i.date<today()?'bad':'warn')+'</p></div><strong class="money">'+money(i.amount)+'</strong></div><div class="actions">'+btn('Confirmar depósito','confirmIncome',i.id)+btn('Editar','income',i.id)+btn('Eliminar','deleteIncome',i.id,'small danger')+'</div></div>'}
function paymentsView(p){
 const groups=[['weekly','Pagos personales semanales · sábados'],['service','Servicios mensuales'],['card','Tarjetas de crédito y departamentales']],tabs=[['pending','Pendientes'],['all','Todos los periodos'],['catalog','Compromisos'],['history','Pagados']];
 const missing=p.inside.some(x=>missingPeriod(state,x).length),capturedPending=p.inside.reduce((a,x)=>a+Math.max(0,required(state,x)-paid(state,x)),0);
 let html='<div class="row wrap"><div><div class="eyebrow">En Control Finanzas</div><h1>Tu tabla de pagos</h1></div>'+btn('Agregar elemento','template','','primary')+'</div><div class="grid"><section class="panel"><div class="muted">Deuda total · todas las tarjetas</div><div class="stat">'+money(debtTotal(state))+'</div></section><section class="panel"><div class="muted">Total de pagos pendientes del periodo</div><div class="stat">'+money(capturedPending)+'</div><p class="hint">Horizonte: hoy → '+fmt(p.horizon)+'.'+(missing?' Total parcial: hay importes por capturar.':'')+' Los pagos de fuera del horizonte se muestran por separado.</p></section></div><div style="height:16px"></div><div class="tabs">'+tabs.map(([id,l])=>btn(l,'paymentsTab',id,'small '+(paymentsTab===id?'active':''))).join('')+'</div>';
 if(paymentsTab==='catalog'){
  for(const[type,title]of groups)html+='<section class="panel"><h2>'+title+'</h2>'+state.templates.filter(t=>t.type===type).map(t=>'<div class="item"><strong>'+esc(t.name)+'</strong> '+pill(t.active?'Activo':'Archivado')+'<div class="actions">'+btn('Editar captura','template',t.id)+btn(t.active?'Archivar':'Reactivar','archive',t.id)+'</div></div>').join('')+'</section>';return html;
 }
 const selected=paymentsTab==='history'?activePeriods(state).filter(x=>mPaid(state,x)):paymentsTab==='all'?activePeriods(state):p.inside;
 for(const[type,title]of groups){const entries=selected.filter(x=>state.templates.find(t=>t.id===x.templateId)?.type===type).sort((a,b)=>a.due.localeCompare(b.due));html+='<section class="panel"><div class="row wrap"><h2>'+title+'</h2>'+btn('Agregar','newKind',type)+'</div>'+entries.map(x=>paymentItem(x,p,x.due>p.horizon)).join('')+(entries.length?'':empty('Sin elementos en esta vista.'))+'</section>';}
 if(paymentsTab==='pending'){html+='<section class="panel"><h2>Fuera del horizonte · sin contemplar</h2><p class="warn">Estos pagos no se incluyen en el total del periodo ni en tu gasto diario libre.</p>'+p.outside.map(x=>paymentItem(x,p,true)).join('')+(p.outside.length?'':empty('No hay otros pagos conocidos.'))+'</section>';}
 return html;
}

function activityView(){return '<div class="row wrap"><div><div class="eyebrow">Sin doble conteo</div><h1>Movimientos</h1></div><div class="actions">'+btn('Anotar gasto','expense','','primary')+btn('Transferir','transfer')+'</div></div><section class="panel"><p class="hint">Editar o borrar un movimiento anterior a una conciliación no cambia ese saldo capturado. Un cierre diario no vuelve a cobrar gastos.</p><label>Buscar movimiento<input id="search" placeholder="Descripción, fecha o cuenta" value="'+esc(search)+'" autocomplete="off"></label><div id="movementList">'+movementList()+'</div></section>'}
function movementList(){let a=[...state.txs].sort((a,b)=>b.date.localeCompare(a.date)||b.seq-a.seq).filter(t=>(t.description+' '+t.date+' '+accountName(t.account)+' '+(state.cards.find(c=>c.id===t.cardId)?.name??'')).toLowerCase().includes(search.toLowerCase()));return a.length?a.slice(0,300).map(t=>'<div class="item"><div class="row topalign"><div><strong>'+esc(t.description||({expense:'Gasto',payment:'Pago',transfer:'Transferencia',income:'Depósito'}[t.type]))+'</strong><p>'+fmt(t.date)+' · '+esc(t.type==='transfer'?accountName(t.from)+' → '+accountName(t.to):t.method==='credit'?(state.cards.find(c=>c.id===t.cardId)?.name??'Tarjeta'):accountName(t.account))+'</p></div><strong class="money '+(t.type==='income'?'good':'')+'">'+(t.type==='income'?'+':'')+money(t.amount)+'</strong></div>'+(t.cycleCut?'<p class="hint">Corte asignado: '+fmt(t.cycleCut)+'</p>':'')+'<div class="actions">'+(t.type==='expense'?btn('Editar gasto','expense',t.id):'')+btn('Eliminar','deleteTx',t.id,'small danger')+'</div></div>').join('')+(a.length>300?'<p class="hint">Se muestran 300 coincidencias. Usa el buscador para filtrar.</p>':''):empty('Todavía no hay movimientos que coincidan.');}
function debtsView(p){const f=forecast(state,p);return '<div class="row wrap"><div><div class="eyebrow">Tu siguiente etapa</div><h1>'+(p.noDebt?'Ya puedes construir tu meta.':'Un plan para salir de deudas.')+'</h1></div>'+btn('Agregar MSI','msi')+'</div><div class="grid"><section class="panel"><div class="muted">Deuda total de tarjetas · incluye MSI</div><div class="stat money">'+money(p.debt)+'</div><p>Prioridad: '+(state.settings.strategy==='avalanche'?'avalancha · tasa más alta':'bola de nieve · saldo menor')+'</p>'+btn('Elegir estrategia y ritmo','nav','settings')+'</section><section class="panel"><h2>Fecha estimada</h2>'+(f.error?'<p class="warn">'+esc(f.error)+'</p>':'<div class="stat">'+fmt(f.date)+'</div><p>'+f.periods+' quincenas con '+money(f.budget)+' por quincena.</p><p class="hint">Escenario: presupuesto base + extra de este plan repetido cada quincena. Sin compras nuevas. Interés nominal anual ÷ 24; mínimos actuales constantes. No incluye IVA, comisiones ni cambios del banco. Los MSI conservan sus fechas de pago y no se anticipan; la proyección agrupa pagos en fechas quincenales 15/30.</p>')+(state.settings.purpose?'<p>Propósito: '+fmt(state.settings.purpose)+'</p>'+(!f.error?'<strong>'+esc(f.status)+'</strong><p>'+(f.extraNeeded==null?'No se puede alcanzar esa fecha con los MSI programados o faltan quincenas disponibles. Revisa condiciones de liquidación con tu banco.':'Extra adicional necesario: '+money(f.extraNeeded)+' por quincena.')+'</p>':''):'<p class="hint">Define tu fecha propósito en Ajustes.</p>')+'</section><section class="panel wide"><h2>Tarjetas · orden de ataque</h2>'+rankCards(state).map((c,n)=>{const t=cardTemplate(state,c.id),bal=cardBalance(state,c),ms=state.msis.filter(m=>m.cardId===c.id);return '<div class="item"><div class="row wrap"><div><span class="muted">'+(n+1)+'. </span><strong>'+esc(c.name)+'</strong>'+(!t?.active?' '+pill('Archivada'):'')+'<p class="hint">Tasa anual: '+(c.rate==null?'sin capturar':(c.rate/100).toFixed(2)+'%')+' · Límite: '+money(c.limit)+'</p></div><strong class="money">Deuda total: '+money(bal)+'</strong></div><p class="hint">Deuda total: incluye todas las compras y MSI pendientes. Las compras nuevas la aumentan y los pagos la reducen por su importe, una sola vez.</p>'+ms.map(m=>'<p>'+esc(m.name)+' · '+money(m.monthly)+'/mes · '+outstandingMSI(state,m)+' mensualidades pendientes '+btn('Editar','msi',m.id)+' '+btn('Eliminar','deleteMSI',m.id,'small danger')+'</p>').join('')+'<div class="actions">'+btn('Editar tarjeta','template',t?.id??'')+btn('Actualizar deuda','cardBalance',c.id)+btn('Abono extra','extraPay',c.id)+'</div></div>'}).join('')+(state.cards.length?'':empty('Agrega tus tarjetas desde Pagos → Agregar compromiso.'))+'</section><section class="panel wide"><h2>Comprar a crédito · último recurso</h2><p>Primero usa tu margen diario. Si necesitas una compra indispensable a crédito, compara espacio disponible y el siguiente corte.</p>'+btn('Comparar tarjetas','recommend')+'</section></div>'+goalView();}
function goalView(){const g=state.goal,saved=wallet(state,'savings')??0,pct=g.target?Math.min(100,100*saved/g.target):0;let projection='Captura una aportación por quincena para proyectar la fecha.';if(g.target!=null&&g.contribution>0){let n=Math.ceil(Math.max(0,g.target-saved)/g.contribution);projection=n>1000?'La proyección supera 1,000 quincenas con esta aportación.':n?'Si aportas '+money(g.contribution)+' cada quincena: '+fmt(payrollDates(addDays(today(),1),Math.min(n,1000))[n-1])+'.':'¡Meta alcanzada con tu saldo capturado!'}return '<section class="panel" style="margin-top:16px"><div class="eyebrow">'+(plan(state).noDebt?'Modo ahorro activo':'Meta en segundo plano')+'</div><div class="row wrap"><h2>'+esc(g.name||'Tu próxima meta')+'</h2>'+btn('Configurar meta','goal')+'</div><p class="stat">'+money(saved)+' <span class="hint">de '+money(g.target)+'</span></p><progress value="'+pct+'" max="100" aria-label="Avance de ahorro"></progress><p>'+pct.toFixed(1)+'% · '+esc(projection)+'</p>'+(g.due?'<p class="hint">Fecha deseada: '+fmt(g.due)+'</p>':'')+'<p class="hint">El ahorro se separa cuando registras una transferencia a Ahorro de meta. Al quedar sin deuda, la aportación configurada sustituye el extra a deuda.</p>'+btn('Apartar ahorro / retirar','transfer')+'</section>'}
function settingsView(){const s=state.settings;return '<div class="eyebrow">A tu manera</div><h1>Configura tu tranquilidad.</h1><div class="grid"><section class="panel"><h2>Saldos actuales</h2>'+['bank','cash','savings'].map(k=>'<div class="item"><div class="row"><strong>'+accountName(k)+'</strong><strong>'+money(wallet(state,k))+'</strong></div><p class="hint">Última conciliación: '+(state.accounts[k].at?esc(new Date(state.accounts[k].at).toLocaleString('es-MX')):'pendiente')+'</p></div>').join('')+btn('Capturar saldo real','balance','','primary')+'</section><section class="panel"><h2>Reglas de tu plan</h2><form id="settingsForm">'+select('essentialKind','Gastos esenciales',[['daily','Monto diario (comida, transporte)'],['envelope','Sobre total para este horizonte']],s.essentialKind)+currency('essential','Esenciales',s.essential)+check('resetEnvelope','Reiniciar sobre desde ahora (solo si usas sobre)')+select('cushionKind','Colchón',[['fixed','Monto fijo'],['percent','Porcentaje del saldo disponible']],s.cushionKind)+currency('cushion','Colchón (si es porcentaje, escribe 10 para 10%)',s.cushion)+currency('extraPct','Inteligente: porcentaje del remanente para extra (0–100)',s.extraPct)+select('strategy','Estrategia de deuda',[['snowball','Bola de nieve: menor saldo'],['avalanche','Avalancha: mayor tasa anual']],s.strategy)+currency('pace','Presupuesto base para deuda por quincena (proyección)',s.pace)+field('purpose','Fecha propósito para liquidar','date',s.purpose)+check('inventoryConfirmed','Ya capturé todos los compromisos que conozco dentro del horizonte',s.inventoryConfirmed)+check('noDebt','Confirmo que no tengo deudas (si no hay tarjetas)',s.noDebt)+submit('Guardar reglas')+'</form></section><section class="panel wide"><div class="row wrap"><h2>Calendario de nóminas</h2>'+btn('Agregar quincena','income')+'</div><p class="hint">Captura tú cada fecha y monto esperado. No se precargan nóminas ni se confirman por el paso del tiempo.</p>'+state.incomes.filter(i=>i.status==='expected').sort((a,b)=>a.date.localeCompare(b.date)).map(incomeItem).join('')+'<details><summary>Depósitos confirmados</summary>'+state.incomes.filter(i=>i.status==='confirmed').sort((a,b)=>b.date.localeCompare(a.date)).map(i=>'<p>'+fmt(i.date)+' · '+money(i.amount)+' · '+(i.txId?'Movimiento registrado':'Ya incluido en saldo capturado')+'</p>').join('')+'</details></section><section class="panel"><h2>Tus respaldos</h2><p>Todo se guarda en este navegador. Los respaldos JSON contienen tus cifras: guárdalos fuera del repositorio.</p><div class="actions">'+btn('Exportar JSON','export','','primary')+btn('Importar JSON','import')+'</div><p class="hint">No hay sincronización entre dispositivos. La copia en Archivos puede ir a iCloud si eliges esa ubicación. Si borras los datos del sitio, necesitarás el respaldo.</p></section><section class="panel"><h2>Recordatorios y uso sin conexión</h2><p>Descarga un calendario con pagos próximos y un recordatorio diario a las 21:00. Debes agregarlo al Calendario del iPhone.</p><div class="actions">'+btn('Generar calendario .ics','calendar')+btn('Activar modo sin conexión','offline')+'</div><p class="hint">El modo sin conexión requiere subir también sw.js junto a index.html. La app sola no envía avisos ni se despierta en segundo plano.</p></section><section class="panel wide"><h2>Cómo se calcula</h2><p>Del saldo reconciliado de nómina más efectivo se apartan pagos vencidos y de hoy, pagos anteriores al siguiente ingreso, el resto del horizonte, esenciales y colchón. Después se propone un extra a deuda o a tu meta. Lo libre se divide entre al menos un día hasta el siguiente ingreso previsto.</p><p>Se reservan desde ahora todos los pagos conocidos del horizonte. Las nóminas previstas solo se usan en un escenario separado. El colchón porcentual usa el saldo confirmado de nómina más efectivo. Los pagos se asignan a una cuenta para detectar falta de liquidez en esa cuenta.</p><p>Si falta un dato necesario, hay déficit o una nómina vencida sin confirmar, el margen diario autorizado es 0. La cifra es una estimación prudente, nunca una garantía de evitar intereses.</p><p class="hint">Los periodos mensuales conservan el día nominal y lo ajustan al último día si hace falta; los semanales avanzan siete días. Revisa cambios bancarios y días inhábiles. Los importes de los periodos nuevos quedan vacíos. Las compras del día de corte pueden ser procesadas por el banco en otro periodo.</p><div class="actions">'+btn('Ver comparación de modos','attack')+btn('Ejecutar pruebas aisladas','tests')+btn('Acerca de privacidad','privacy')+'</div></section></div>';}

function icsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function foldICS(line){let out='',part='',bytes=0;for(const ch of line){let len=new TextEncoder().encode(ch).length;if(bytes+len>73){out+=part+'\r\n ';part='';bytes=1}part+=ch;bytes+=len}return out+part}
function calendarText(s,at=today()){let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//En Control Finanzas//Recordatorios locales//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'],stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z');const event=(id,start,title,desc,repeat,alarm)=>{lines.push('BEGIN:VEVENT','UID:'+id+'@mi-margen.local','DTSTAMP:'+stamp,'DTSTART:'+start,'DURATION:PT15M','SUMMARY:'+icsEscape(title),'DESCRIPTION:'+icsEscape(desc));if(repeat)lines.push('RRULE:'+repeat);lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEscape(title),'TRIGGER:'+alarm,'END:VALARM','END:VEVENT')};for(const p of activePeriods(s).filter(p=>p.due>=at&&p.due<=addDays(at,90)&&!mPaid(s,p)))event(p.id,p.due.replace(/-/g,'')+'T090000','Revisar pago · '+label(s,p),'Verifica el importe y registra el pago en En Control Finanzas. No es un pago automático.',null,'-P1D');event('cierre-diario',at.replace(/-/g,'')+'T210000','Cierra tu día · En Control Finanzas','Registra gastos con su medio de pago y revisa el día.','FREQ=DAILY','PT0S');lines.push('END:VCALENDAR');return lines.map(foldICS).join('\r\n')+'\r\n'}

 test('Esenciales y colchón se respetan en ambos modos',()=>{const s=fixture(),{c,p}=card(s);const smart=plan(s,at,'smart'),aggr=plan(s,at,'aggressive');assert(aggr.daily>=0&&aggr.extra>=smart.extra&&aggr.essential===smart.essential&&aggr.cushion===smart.cushion)});
 test('Dinero fuera del horizonte no se da por cubierto',()=>{const s=fixture(),{p}=card(s);p.due='2026-12-10';const r=plan(s,at);assert(r.outside.some(x=>x.id===p.id)&&r.obligations===0)});
 test('Fechas fin de mes: febrero y vuelta a marzo conservan día nominal',()=>{assert(month('2027-01-31',1)==='2027-02-28'&&month('2027-01-31',2)==='2027-03-31')});
 test('Saldo de ahorro separado del disponible',()=>{const s=fixture();transaction(s,{type:'transfer',from:'bank',to:'savings',amount:200000,date:at,description:'Ficticio'});assert(plan(s,at).available===800000&&wallet(s,'savings')===200000)});
 test('Exportar e importar preserva saldo y validación rechaza negativos',()=>{const s=fixture();assert(wallet(validate(JSON.parse(JSON.stringify(s))),'bank')===1000000);s.accounts.bank.amount=-1;let rejected=false;try{validate(s)}catch{rejected=true}assert(rejected)});
 test('Calendario iPhone: CRLF, alertas y texto escapado',()=>{const s=fixture();const str=calendarText(s,at);assert(str.includes('BEGIN:VALARM\r\n')&&str.includes('RRULE:FREQ=DAILY')&&icsEscape('a,b;c')==='a\\,b\\;c')});
 test('Proyección sin tasas no inventa una fecha',()=>{const s=fixture(),{c}=card(s);c.rate=null;assert(!!simulate(s,100000,at).error)});
 test('Proyección de deuda sin interés usa el presupuesto capturado',()=>{const s=fixture(),{c}=card(s);c.rate=0;const r=simulate(s,100000,at);assert(!r.error&&r.periods===5&&r.date==='2027-01-15')});
 test('Proyección MSI conserva cortes futuros y no anticipa la liquidación',()=>{const s=fixture(),{c}=card(s);c.rate=0;c.balance=200000;s.msis.push({id:'m1',name:'Ficticio',cardId:c.id,total:200000,months:2,monthly:100000,remaining:2,firstCut:'2026-12-20'});const r=simulate(s,200000,at);assert(!r.error&&r.date==='2027-01-30')});
 test('Efectivo suficiente no oculta falta de nómina para un pago bancario',()=>{const s=fixture(),{p}=card(s);s.accounts.bank.amount=50000;s.accounts.cash.amount=1000000;s.settings.essential=0;s.settings.cushion=0;const r=plan(s,at);assert(r.daily===0&&r.issues.some(i=>i.includes('Nómina no alcanza')))});
 test('Periodos pagados conservan importe al cambiar la excepción MSI',()=>{const s=fixture(),{c,p}=card(s);s.msis.push({id:'m1',name:'Ficticia',cardId:c.id,total:200000,months:2,monthly:100000,remaining:2,firstCut:p.cut});p.fixedTotal=required(s,p);p.fixedSeq=s.seq;transaction(s,{type:'payment',amount:100000,principal:100000,account:'bank',cardId:c.id,periodId:p.id,date:at,description:'Ficticio'});c.msiIncluded=false;assert(required(s,p)===100000&&mPaid(s,p))});
 test('Sobre de esenciales disminuye por gastos sin reiniciarse al cambiar el día',()=>{const s=fixture();s.settings.essentialKind='envelope';s.settings.essential=50000;transaction(s,{type:'expense',amount:10000,method:'debit',account:'bank',essential:true,date:at,description:'Ficticio'});assert(plan(s,at).essential===40000&&plan(s,addDays(at,1)).essential===40000)});
 test('MSI con meses pendientes ausentes impide un margen confiable',()=>{const s=fixture(),{c,p}=card(s);s.msis.push({id:'m1',name:'Ficticia',cardId:c.id,total:100000,months:2,monthly:50000,remaining:null,firstCut:p.cut});assert(plan(s,at).daily===0&&plan(s,at).issues.some(i=>i.includes('MSI incompleto')))});
 test('Importación rechaza un importe congelado negativo',()=>{const s=fixture(),{p}=card(s);p.fixedTotal=-100;p.fixedSeq=0;let rejected=false;try{validate(s)}catch{rejected=true}assert(rejected)});

 test('FICTICIO · primera instalación sin nombres, cifras ni fechas personales',()=>{const s=fresh();assert(s.incomes.length===0&&s.cards.length===0&&s.templates.length===0&&s.periods.length===0&&s.accounts.bank.amount===null&&s.accounts.cash.amount===null)});
 test('FICTICIO · Pagado sí reduce deuda y dinero por el importe una vez',()=>{const s=fixture(),{c,p}=card(s);setPeriodPaid(s,p,true);assert(wallet(s,'bank')===900000&&cardBalance(s,c)===400000&&mPaid(s,p)&&s.txs.length===1)});
 test('FICTICIO · repetir Pagado sí no genera un segundo descuento',()=>{const s=fixture(),{c,p}=card(s);setPeriodPaid(s,p,true);setPeriodPaid(s,p,true);assert(wallet(s,'bank')===900000&&cardBalance(s,c)===400000&&s.txs.length===1)});
 test('FICTICIO · Pagado no revierte el movimiento sin duplicaciones',()=>{const s=fixture(),{c,p}=card(s);setPeriodPaid(s,p,true);setPeriodPaid(s,p,false);setPeriodPaid(s,p,false);assert(wallet(s,'bank')===1000000&&cardBalance(s,c)===500000&&!mPaid(s,p)&&s.txs.length===0)});
 test('FICTICIO · tarjeta de importe 0 permite No hay deuda y mínimo vacío',()=>{const s=fixture(),{c,p}=card(s);c.balance=0;p.pgni=0;p.minimum=null;p.notes='No hay deuda';p.zeroPaid=false;validate(s);assert(required(s,p)===0&&p.notes==='No hay deuda'&&!mPaid(s,p));setPeriodPaid(s,p,true);assert(mPaid(s,p)&&s.txs.length===0&&wallet(s,'bank')===1000000)});
 test('FICTICIO · pago ya incluido en dinero no vuelve a restarlo',()=>{const s=fixture(),{c,p}=card(s);s.accounts.bank.amount=900000;setPeriodPaid(s,p,true,{inSnapshot:true});assert(wallet(s,'bank')===900000&&cardBalance(s,c)===400000)});
 test('FICTICIO · pago ya incluido en deuda no vuelve a descontarla',()=>{const s=fixture(),{c,p}=card(s);c.balance=400000;setPeriodPaid(s,p,true,{cardInSnapshot:true});assert(wallet(s,'bank')===900000&&cardBalance(s,c)===400000)});
 test('FICTICIO · suma de tarjetas distingue deuda de pago del periodo',()=>{const s=fixture(),{c,p}=card(s);s.cards.push({...c,id:'c2',name:'Segunda tarjeta ficticia',balance:200000});assert(debtTotal(s)===700000&&plan(s,at).obligations===100000);setPeriodPaid(s,p,true);assert(debtTotal(s)===600000&&plan(s,at).obligations===0)});
 test('FICTICIO · JSON conserva observaciones, deuda y estado pagado',()=>{const s=fixture(),{c,p}=card(s);p.description='Elemento ficticio';p.notes='Observación ficticia';setPeriodPaid(s,p,true);const restored=validate(JSON.parse(JSON.stringify(s))),r=restored.periods.find(x=>x.id===p.id);assert(mPaid(restored,r)&&r.notes===p.notes&&r.description===p.description&&debtTotal(restored)===400000&&wallet(restored,'bank')===900000)});
 test('FICTICIO · el mínimo es opcional para registrar el pago',()=>{const s=fixture(),{p}=card(s);p.minimum=null;setPeriodPaid(s,p,true);assert(mPaid(s,p)&&missingPeriod(s,p).length===0)});
 return results;
}
/* END SELF TESTS */
// La primera apertura diaria muestra el margen; los eventos de cierre no mueven dinero.
if(storageOK){save(s=>roll(s));}render();if(storageOK&&!state.daily[today()])morningDialog();
</script>
